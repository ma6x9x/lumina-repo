name: Publish OmniAI to APT index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-omniai-apt.yml'
      - 'scripts/apt_add_omniai.py'

permissions:
  contents: write

concurrency:
  group: publish-omniai-apt
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip if OmniAI already indexed
        id: check
        run: |
          set -euo pipefail
          if grep -q 'Package: com.kolby.omniai' Packages && \
             test -f dist/com.kolby.omniai_1.0.0_iphoneos-arm64.deb && \
             test -f dist/com.kolby.omniai_1.0.0_iphoneos-arm64e.deb; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "OmniAI already on main APT index — nothing to do"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull OmniAI debs from publish branch
        if: steps.check.outputs.already != 'true'
        run: |
          set -euo pipefail
          git fetch origin cursor/publish-omniai-1-0-0-8f42
          git checkout origin/cursor/publish-omniai-1-0-0-8f42 -- \
            dist/com.kolby.omniai_1.0.0_iphoneos-arm64.deb \
            dist/com.kolby.omniai_1.0.0_iphoneos-arm64e.deb
          ls -la dist/com.kolby.omniai*
          md5sum dist/com.kolby.omniai*

      - name: Refresh Packages index
        if: steps.check.outputs.already != 'true'
        run: python3 scripts/apt_add_omniai.py

      - name: Commit and push to main
        if: steps.check.outputs.already != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/com.kolby.omniai_1.0.0_iphoneos-arm64.deb \
                  dist/com.kolby.omniai_1.0.0_iphoneos-arm64e.deb \
                  Packages Packages.gz Packages.bz2 Packages.xz Release
          git status
          git diff --cached --stat
          git commit -m "Publish OmniAI 1.0.0 into Sileo APT index on main"
          git push origin HEAD:main
